<!--
  ANIMASTER — Webflow Embed Code
  Вставляется целиком в Custom Code проекта: Project Settings →
  Custom Code → Footer Code (Before </body> tag).
  Можно копировать в разные проекты почти без изменений — единственное,
  что обычно требует правки под конкретный проект: блок Custom Cursor
  внизу (просто удалите его, если курсор не нужен).
-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/split-type"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<!-- Библиотека анимаций (версия зафиксирована тегом релиза) -->
<script src="https://cdn.jsdelivr.net/gh/k23webagency/animations-lib@v1.0.0/animations.js"></script>

<script>
(function () {
  // --- Плавный скролл (Lenis) ---
  const lenis = new Lenis({
    duration: 1.2,
    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    direction: 'vertical',
    gestureDirection: 'vertical',
    smooth: true,
    mouseMultiplier: 1,
    smoothTouch: false,
    touchMultiplier: 2,
    infinite: false,
  });

  function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
  }
  requestAnimationFrame(raf);

  // --- Связка Lenis + ScrollTrigger ---
  gsap.registerPlugin(ScrollTrigger);
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add((time) => {
    lenis.raf(time * 1000);
  });
  gsap.ticker.lagSmoothing(0);

  window.addEventListener('load', () => {
    // Снимаем блокировку FOUC (класс ставится отдельным скриптом в <head>, см. README)
    document.documentElement.classList.remove('js-loading');

    // Запуск анимаций из animations.js
    if (typeof initAnimations === 'function') {
      initAnimations();
    }

    // Запуск физики (Matter.js), если на странице есть .physics-container
    if (typeof initPhysics === 'function' && document.querySelector('.physics-container')) {
      initPhysics();
    }

    // --- Custom Cursor (опционально, удалите блок если не нужен в проекте) ---
    const cursor = document.getElementById('custom-cursor');
    const cursorText = cursor ? cursor.querySelector('.cursor-text') : null;

    if (cursor) {
      gsap.set(cursor, { xPercent: -50, yPercent: -50 });

      let xTo = gsap.quickTo(cursor, "x", { duration: 0.2, ease: "power3" }),
          yTo = gsap.quickTo(cursor, "y", { duration: 0.2, ease: "power3" });

      window.addEventListener('mousemove', (e) => {
        xTo(e.clientX);
        yTo(e.clientY);
      });

      document.querySelectorAll('[data-cursor]').forEach(el => {
        el.addEventListener('mouseenter', () => {
          const text = el.getAttribute('data-cursor');
          if (cursorText) cursorText.textContent = text;
          cursor.classList.add('active');
        });
        el.addEventListener('mouseleave', () => {
          cursor.classList.remove('active');
          if (cursorText) cursorText.textContent = '';
        });
      });
    }

    // Пересчёт ScrollTrigger после полной загрузки (важно для SplitType и Pin)
    setTimeout(() => {
      ScrollTrigger.refresh();
    }, 100);
  });
})();
</script>
